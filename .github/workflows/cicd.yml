name: Build & Deploy Spring Boot to Mini PC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Project with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Show JAR Manifest (Check Main-Class)
        run: |
          echo "Checking MANIFEST.MF contents in beyour.jar"
          unzip -p build/libs/beyour.jar META-INF/MANIFEST.MF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & Push Docker Image to Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
          docker build -t $DOCKER_HUB_USERNAME/beyour-app:latest .
          docker push $DOCKER_HUB_USERNAME/beyour-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v3

      - name: Check GitHub Actions Runner Public IP
        run: curl ifconfig.me

      - name: SSH Deploy & Run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: soojin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 234
          script: |
            echo "✅ Successfully connected to Mini PC!"

            # 기존 컨테이너 정리
            docker stop beyour-app || true
            docker rm beyour-app || true

            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/beyour-app:latest

            # Firebase JSON 저장
            echo '${{ secrets.FIREBASE_CONFIG }}' | base64 -d > firebase-key.json

            # Spring Boot 환경 변수 설정
            cat <<EOF > .env
            spring.datasource.url=${{ secrets.DB_URL }}
            spring.datasource.username=${{ secrets.DB_USERNAME }}
            spring.datasource.password=${{ secrets.DB_PASSWORD }}
            firebase.configuration-file=firebase-key.json
            firebase.bucket=${{ secrets.FIREBASE_BUCKET }}
            EOF

            # 컨테이너 실행
            docker run -d -p 8080:8080 --name beyour-app \
              --env-file .env \
              -v $(pwd)/firebase-key.json:/app/firebase-key.json \
              -w /app \
              ${{ secrets.DOCKER_HUB_USERNAME }}/beyour-app:latest

            # 정리
            rm .env
            docker image prune -f
