name: Build & Deploy Spring Boot to Mini PC

on:
  push:
    branches:
      - main  # main 브랜치에 Push하면 실행됨!
  workflow_dispatch:  # 직접 실행 가능하도록 추가

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Project with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Rename JAR File
        run: |
          ls -lh build/libs  # 빌드된 JAR 파일 목록 확인
          mv $(ls build/libs/*.jar | head -n 1) build/libs/beyour.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & Push Docker Image to Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
          docker build -t $DOCKER_HUB_USERNAME/beyour-app:latest .
          docker push $DOCKER_HUB_USERNAME/beyour-app:latest

  deploy:
    needs: build  # Build가 끝난 후 자동으로 실행됨!
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to Mini PC (via SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem
          ssh -i private_key.pem -o StrictHostKeyChecking=no -p 234 soojin@$SERVER_IP "
            docker stop spring-beyour || true &&
            docker rm spring-beyour || true &&
            docker pull $DOCKER_HUB_USERNAME/beyour-app:latest &&
            docker run -d -p 8080:8080 --name spring-beyour -e DB_URL=$DB_URL -e DB_USERNAME=$DB_USERNAME -e DB_PASSWORD=$DB_PASSWORD -e FIREBASE_CONFIG=$FIREBASE_CONFIG $DOCKER_HUB_USERNAME/beyour-app:latest
          "

