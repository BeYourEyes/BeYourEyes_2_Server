name: Deploy Spring Boot to Mini PC

on:
  push:
    branches:
      - main  # ✅ main 브랜치에 Push될 때 실행

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/beyour-app
  SERVER_HOST: ${{ secrets.SERVER_IP }}  # ✅ 미니 PC의 IP
  SERVER_SSH_USER: soojin
  SSH_PORT: 234  # ✅ SSH 포트 (234)

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗️ Build Project with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 📂 Check if JAR file exists
        run: ls -lh build/libs  # ✅ JAR 파일이 정상적으로 생성되었는지 확인!

      - name: 📦 Rename JAR File
        run: |
          mv $(ls build/libs/*.jar | head -n 1) build/libs/beyour.jar

      - name: 📤 Push Docker Image to Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/beyour-app .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/beyour-app

  deploy-to-ubuntu-server:
    name: Deploy to Mini PC
    runs-on: ubuntu-latest
    needs: build-and-push  # ✅ Build 완료 후 실행

    steps:
      - name: 🚀 Deploy to Mini PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "✅ Successfully connected to Mini PC!"
            docker stop spring-beyour || true
            docker rm spring-beyour || true
            docker pull ${{ env.DOCKER_IMAGE_NAME }}
            docker run -d -p 8080:8080 --name spring-beyour \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e FIREBASE_CONFIG=${{ secrets.FIREBASE_CONFIG }} \
              ${{ env.DOCKER_IMAGE_NAME }}
